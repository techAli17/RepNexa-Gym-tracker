appId: ${APP_ID || "com.repnexa"}
name: Add a template as a routine and start it from Home
---
- launchApp:
    clearState: true
- extendedWaitUntil:
    visible: "Add routines"
    timeout: 60000
- tapOn: "Add routines"
- assertVisible: "Templates"
- tapOn:
    text: "Add"
    index: 0                       # Push
- assertVisible: "Push added to your routines"
- tapOn: "Back|Navigate up"   # header back button: iOS label | Android label
- assertVisible: "Next up: Push.*"
- tapOn: "Next up: Push.*"
- assertVisible: "Bench Press.*"
- assertVisible: "Overhead Press.*"
- scrollUntilVisible:
    element: "Discard workout"
    direction: DOWN
    visibilityPercentage: 50
    centerElement: true
    timeout: 45000            # five exercises: a long list
- tapOn: "Discard workout"
- tapOn: "Discard|DISCARD"    # the confirmation alert button (iOS | Android)
- assertVisible: "Next up: Push.*"
